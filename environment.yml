name: dev-ai-project

channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.12.14
  - pip
  - pip:
      - ollama
      - "gradio>=6.30,<7" # the UI uses gr.HTML server_functions
      - pydantic
      - python-dotenv
      - pytest
      - "mcp>=1.2,<2" #<2 because FastMCP is called different and else server dies
      - httpx
      - "psycopg[binary]>=3.1"
      - tldextract
      - beautifulsoup4