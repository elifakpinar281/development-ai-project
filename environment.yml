name: dev-ai-project

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      - ollama
      - gradio
      - pydantic
      - python-dotenv
      - pytest
      - "mcp>=1.2,<2" #<2 because FastMCP is called different and else server dies
      - httpx
      - "psycopg[binary]>=3.1"
      - tldextract
      - beautifulsoup4
