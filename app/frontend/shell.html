<div class="stp">
  <header class="stp-top">
    <a class="stp-logo" href="#/analyze" aria-label="Spot the phish. home">
      <img src="{{LOGO}}" alt="">
      <span>Spot the <em>phish.</em></span>
    </a>
    <nav class="stp-nav">
      <a href="#/analyze" data-nav="analyze">Analyze</a>
      <a href="#/campaigns" data-nav="campaigns">Campaigns</a>
      <a href="#/chats" data-nav="chats">Previous Chats</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
  </header>

  <div class="stp-body">
    <aside class="stp-side">
      <section class="side-sec" data-sec="emails">
        <div class="side-head">
          <span class="side-title">Previous Emails</span>
          <span class="side-count" data-count="emails">0</span>
          <button class="icon-btn chev" type="button" data-collapse="emails" aria-label="Show or hide previous emails">
            <svg width="16" height="10" viewBox="0 0 16 10" fill="none"><path d="M1.5 1.5 8 8l6.5-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn panel-btn" type="button" data-side-toggle aria-label="Hide sidebar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1.25" y="1.25" width="15.5" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 1.5v15" stroke="currentColor" stroke-width="1.8"/><rect x="2" y="2" width="4.5" height="14" fill="currentColor"/></svg>
          </button>
        </div>
        <ul class="side-list side-emails" data-list="emails"></ul>
      </section>
      <div class="side-divider"></div>
      <section class="side-sec" data-sec="campaigns">
        <div class="side-head">
          <span class="side-title">Ongoing Campaigns</span>
          <span class="side-count" data-count="campaigns">0</span>
          <button class="icon-btn chev" type="button" data-collapse="campaigns" aria-label="Show or hide campaigns">
            <svg width="16" height="10" viewBox="0 0 16 10" fill="none"><path d="M1.5 1.5 8 8l6.5-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <ul class="side-list" data-list="campaigns"></ul>
      </section>
    </aside>

    <button class="icon-btn side-open" type="button" data-side-toggle aria-label="Show sidebar">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1.25" y="1.25" width="15.5" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 1.5v15" stroke="currentColor" stroke-width="1.8"/><rect x="2" y="2" width="4.5" height="14" fill="currentColor"/></svg>
    </button>

    <main class="stp-main" data-main></main>
  </div>

  <button type="button" class="help-btn" data-help aria-label="Show or hide help"><span class="help-q">?</span>Help</button>
  <aside class="note" data-help-note aria-label="How it works"></aside>
  <input type="file" accept=".eml,.txt,message/rfc822" data-file hidden>
</div>
