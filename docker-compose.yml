services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spotthephish
      POSTGRES_PASSWORD: spotthephish
      POSTGRES_DB: spotthephish
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
volumes:
  pgdata: